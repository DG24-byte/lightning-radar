<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#30363d" stroke-width="8"/>

  <!-- Concentric Radar / Thunder Waves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 10" opacity="0.25"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#ffd700" stroke-width="4" opacity="0.35"/>

  <!-- High-Voltage Lightning Bolt -->
  <path d="M280 48 L144 268 L248 268 L216 464 L368 224 L264 224 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round"/>
</svg>
